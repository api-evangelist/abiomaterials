domain_standards:
  applicable: false
  note: >-
    The provider's market is exosome-derived cosmetic and medical biomaterials -
    a manufacturing and regulatory market with no API-level interchange standard
    of the SCIM / OData / HL7 / OpenRTB kind. No domain-standard signature was
    looked for beyond that, and none is invented to fill the slot. Reward-only
    check; correctly scores nothing rather than penalising.
regulatory_context:
  note: >-
    Recorded as context, NOT as a published API compliance programme and NOT
    wired to a Compliance pointer. The company's own homepage states products are
    "manufactured by ABIO materials Co. in Korea" and that "ABIO materials USA
    Inc. serves as the official importer and distributor across North America,
    maintaining full global regulatory compliance, with all products listed with
    the U.S. Food and Drug Administration (FDA)". These are product-regulatory
    statements about cosmetics and medical materials. No SOC 2, ISO 27001, PCI,
    HIPAA or FedRAMP attestation, and no trust centre, exists on either host.
  evidence: https://a-biousa.com/
