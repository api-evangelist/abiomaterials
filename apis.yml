aid: abiomaterials
name: A-Bio Materials
description: >-
  A-Bio Materials Co., Ltd. (에이바이오머티리얼즈) is a South Korean life-science company,
  founded in 2020 and led by founder and CEO Sijun Park, that develops and manufactures
  exosome-derived bioactive materials for cosmetics, aesthetics and medical devices. It
  produces plant-, human- and microbial-derived exosome formulations and PDRN raw
  materials through its own Exo-traction, Celltivation and Escentraction purification and
  cultivation processes, supplying skincare and medical-device manufacturers with
  ingredients for cell signalling, inflammation reduction, collagen synthesis and tissue
  regeneration. Its North American arm, ABio materials USA Inc. of Tustin, California, is
  the official importer and distributor for the region and operates the company's
  English-language storefront. A-Bio Materials runs no developer programme and publishes
  no API specification; the machine-readable surfaces recorded in this profile are the
  WordPress, WooCommerce and WebMCP endpoints its North American storefront serves.
