x-parent-relationship:
  statement: >-
    ABio materials USA Inc. (a-biousa.com) is the North American importer and distributor
    for A-Bio Materials Co., Ltd. of Korea, stated on its own homepage - "products
    manufactured by ABIO materials Co. in Korea" and "ABIO materials USA Inc. serves as
    the official importer and distributor across North America" - and corroborated by its
    published contact address using the Korean parent's own domain (jkkil@a-bio.co.kr).
    This is why artifacts in this repo are served from a-biousa.com rather than a-bio.co.kr.
  evidence: https://a-biousa.com/
x-notes:
  notes:
  - >-
    NOT WIRED ON PURPOSE - authentication/abiomaterials-authentication.yml exists and is
    accurate, but no `Authentication` pointer is emitted: the artifact records that the
    company documents no authentication at all, and the scored check asserts that the
    PROVIDER publishes auth documentation. Wiring it would credit an absence as a presence.
  - >-
    a-bio.co.kr is a SOFT-404 CATCH-ALL. Every path returns HTTP 200 with the same
    3,018-byte HTML error page; verified byte-identical against a nonsense control path.
    No probe result from that host may be read from its status code alone.
  - >-
    No OpenAPI, Swagger, GraphQL, AsyncAPI, gRPC/Protobuf or WSDL contract is published on
    any host. Contract discovery covered /openapi.json, /openapi.yaml, /swagger.json,
    /api-docs, /docs, /redoc, /graphql and ?wsdl on all four hosts.
  - >-
    No A2A agent card is served. /.well-known/agent-card.json and /.well-known/agent.json
    return 404 on a-biousa.com and a soft-404 on a-bio.co.kr, so nothing was written to a2a/.
