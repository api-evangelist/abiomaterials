apis:
- name: ABio Materials WebMCP Tools
  description: >-
    A live, anonymous, agent-callable WebMCP surface served from the North American
    storefront and discovered through the site's RFC 9727 api-catalog. Six tools with
    JSON Schema inputs expose site identity, deep content search, page retrieval and a
    full sitemap. It is platform-authored - produced by a WordPress plugin, not designed
    by the company - and it exposes site content rather than the company's biomaterials
    business. It is recorded because it is genuinely reachable and callable today.
